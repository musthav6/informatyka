<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лідери конспект-ігор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;600;700&display=swap">
<style>
  :root{--bg:#0b1222;--card:#141c34;--fg:#eef2ff;--muted:#9aa5c8;--acc:#8b8cf8;--gold:#facc15;color-scheme:dark}
  :root[data-theme="light"]{--bg:#f3f5fb;--card:#fff;--fg:#141a33;--muted:#5d6584;--acc:#4f46e5;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,rgba(124,58,237,.35),transparent 60%),var(--bg);color:var(--fg);font-family:Rubik,system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:18px}
  h1{font-family:Unbounded,Rubik,sans-serif;font-size:clamp(24px,5vw,44px);margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  select,button{font:inherit;font-size:18px;padding:10px 14px;border-radius:12px;border:1.5px solid #334155;background:var(--card);color:var(--fg)}
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:grid;grid-template-columns:56px 1fr auto auto;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:12px 16px;font-size:clamp(18px,3vw,28px);font-variant-numeric:tabular-nums}
  li .pl{font-weight:800;text-align:center}
  li .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .tm{color:var(--muted)}
  .bonus{font-size:.6em;background:var(--gold);color:#422006;border-radius:999px;padding:2px 8px;font-weight:800;vertical-align:middle}
  .hint{color:var(--muted)}
  a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html">← Усі уроки</a>
  <h1>🏆 Лідери конспект-ігор</h1>
  <div class="row"><select id="game"></select><select id="cls"></select><button id="upd">Оновити</button></div>
  <ol id="list"></ol>
  <p class="hint">Перша спроба кожного учня: спершу бали, потім час. 🏅 +1 бал — троє найшвидших із результатом «усе правильно». Оновлюється кожні 30 с.</p>
</div>
<script src="config.js?v=202610202319"></script>
<script>
  const GAMES = [["5-q7", "5 клас · урок 7 · Мережа-Арена"], ["5-q8", "5 клас · урок 8 · Пошук-ран"], ["6-q7", "6 клас · урок 7 · Медіа-острови"], ["6-q8", "6 клас · урок 8 · Прем'єра-ран"], ["7-q7", "7 клас · урок 7 · Кіностудія Ліцею"], ["7-q8", "7 клас · урок 8 · Кольоровий тир"]];
  const $ = (id) => document.getElementById(id), esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const p = new URLSearchParams(location.search);
  $("game").innerHTML = GAMES.map(([id, t]) => `<option value="${id}">${t}</option>`).join("");
  const fillCls = () => { const g = $("game").value[0]; $("cls").innerHTML = CONFIG.CLASSES.filter((c) => c[0] === g).map((c) => `<option>${c}</option>`).join(""); };
  if (p.get("t")) $("game").value = p.get("t"); fillCls(); if (p.get("c")) $("cls").value = p.get("c");
  $("game").onchange = () => { fillCls(); load(); }; $("cls").onchange = load; $("upd").onclick = load;
  const short = (s) => { const w = String(s).trim().split(/\s+/); return w.length < 2 ? w[0] : `${w[1]} ${w[0][0]}.`; };
  const fmt = (m) => { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  async function load() {
    if (!CONFIG.QUEST_BOARD) { $("list").innerHTML = "<p class='hint'>Таблицю лідерів ще не ввімкнено (потрібен новий Code.gs і QUEST_BOARD: true у config.js).</p>"; return; }
    try {
      const r = await fetch(CONFIG.SHEETS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "board", test: $("game").value, cls: $("cls").value }) });
      const d = await r.json();
      $("list").innerHTML = !d.rows || !d.rows.length ? "<p class='hint'>Ще ніхто не пройшов.</p>" : d.rows.slice(0, 15).map((x, i) => `<li><span class="pl">${i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1}</span><span class="nm">${esc(short(x.name))} ${x.bonus ? '<span class="bonus">🏅 +1</span>' : ""}</span><span>${x.score}/${x.total}</span><span class="tm">${fmt(x.min)}</span></li>`).join("");
    } catch (e) { $("list").innerHTML = "<p class='hint'>Не вдалося завантажити — перевір інтернет.</p>"; }
  }
  load(); setInterval(load, 30000);
</script>
</body>
</html>
