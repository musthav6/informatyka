<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-коди уроків</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=202610071845">
</head>
<body>
<!-- Один урок — на весь екран, для проєктора -->
<div class="qone" id="qrOne" hidden>
  <p class="eyebrow" id="qoTitle"></p>
  <h1 id="qoSub"></h1>
  <img id="qoImg" alt="QR-код уроку">
  <p class="qurl" id="qoUrl"></p>
  <a href="index.html" id="qoBack" class="link noprint">← До уроку</a>
</div>

<!-- Усі уроки — для друку -->
<div class="wrap wide" id="qrAll" hidden>
  <header class="noprint">
    <a href="index.html" class="link">← Усі уроки</a>
    <div class="eyebrow" style="margin-top:12px">Для вчителя</div>
    <h1>QR-коди уроків</h1>
    <p class="small muted">Клацни на код — відкриється на весь екран для проєктора. Ctrl + P — роздрукувати всі.</p>
  </header>
  <div class="qgrid" id="qrGrid"></div>
</div>
<script src="config.js?v=202610071845"></script>
<script src="lessons.js?v=202610071845"></script>
<script src="assets/site.js?v=202610071845"></script>
<script>SITE.renderQR();</script>
</body>
</html>
